name = "judys-api"
main = "src/index.js"
compatibility_date = "2024-11-01"
workers_dev = true

# After first deploy, attach this route in Cloudflare so https://judysvb.com/api/* hits the Worker:
# Dashboard → Workers → judys-api → Triggers → Add route: judysvb.com/api/*

# Create KV, then paste the id here:
#   npx wrangler kv namespace create SUBSCRIBERS
[[kv_namespaces]]
binding = "SUBSCRIBERS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[vars]
# Override in production with: npx wrangler secret put ADMIN_PASSWORD
# ADMIN_PASSWORD is read from secrets when set; fallback below is for first local test only.
DEFAULT_ADMIN_PASSWORD = "judys-admin"
